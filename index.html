<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Critical: Charset and viewport MUST be first -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Performance: Preconnect to external domains (before any resource hints) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://www.googletagmanager.com">
    <link rel="dns-prefetch" href="https://cdn.iubenda.com">
    <link rel="dns-prefetch" href="https://cs.iubenda.com">
    
    <!-- Performance: Preload critical font with font-display:swap -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"></noscript>
    
    <!-- Favicon Configuration -->
    <link rel="icon" type="image/png" sizes="32x32" href="/logo.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/logo.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/logo.png" />
    <link rel="shortcut icon" href="/logo.png" />
    <link rel="manifest" href="/manifest.json" />
    
    
    <!-- Optimized SEO Meta Tags -->
    <title>SpireTrack — Async Standup, Team Chat & Project Tracking Tool</title>
    <meta name="description" content="The all-in-one team productivity platform. Replace daily status meetings with async weekly check-ins, real-time team chat, and project tracking. Free for getting started." />
    
    <!-- Focused Keywords (High Intent) -->
    <meta name="keywords" content="async standup tool, team chat app, project tracking software, weekly check-in app, remote team management, automated status reports, team alignment tool, startup productivity software, collaboration platform" />

    <meta name="author" content="SpireTrack" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large" />
    
    <!-- Additional Meta Tags for Search -->
    <meta name="application-name" content="SpireTrack" />
    <meta name="apple-mobile-web-app-title" content="SpireTrack" />
    <meta name="coverage" content="Worldwide" />
    <meta name="distribution" content="Global" />
    <meta name="rating" content="Business" />
    <meta name="revisit-after" content="3 days" />
    <meta name="target" content="work" />
    <meta name="HandheldFriendly" content="True" />
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://spiretrack.app/" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SpireTrack" />
    <meta property="og:title" content="SpireTrack — Async Standups & Team Chat Platform" />
    <meta property="og:description" content="Stop wasting time in meetings. Use SpireTrack for asynchronous standups, real-time messaging, and project visibility. The modern OS for remote teams." />
    <meta property="og:image" content="https://spiretrack.app/og-image.png" />
    <meta property="og:url" content="https://spiretrack.app/" />
    <meta property="og:locale" content="en_US" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SpireTrack — Async Standups & Team Chat" />
    <meta name="twitter:description" content="Run your team without the meeting fatigue. Async check-ins + Team Chat in one place." />
    <meta name="twitter:image" content="https://spiretrack.app/twitter-card.png" />
    
    <!-- Theme Color -->
    <meta name="theme-color" content="#059669" />
    
    <!-- JSON-LD Structured Data for Software Application -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "SpireTrack",
      "alternateName": ["Spire Track", "Spire App"],
      "headline": "Async Standup & Team Collaboration Platform",
      "description": "SpireTrack helps remote teams stay aligned without status meetings. Features include asynchronous weekly check-ins, real-time team chat with file sharing, and project tracking dashboards.",
      "url": "https://spiretrack.app",
      "applicationCategory": "ProductivityApplication",
      "operatingSystem": "Web Browser, iOS, Android",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD",
        "description": "Free Starter Plan"
      },
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "4.9",
        "ratingCount": "120"
      },
      "featureList": [
        "Asynchronous Daily Standups",
        "Weekly Team Check-ins",
        "Real-time Team Chat",
        "Project Progress Tracking",
        "Team Mood & Morale Analytic",
        "Automated Status Reporting"
      ],
      "screenshot": "https://spiretrack.app/screenshot.png",
      "softwareVersion": "2.0",
      "author": {
        "@type": "Organization",
        "name": "SpireTrack Inc."
      }
    }
    </script>

    <script type="application/ld+json">

      "logo": "https://spiretrack.app/logo.png",
      "description": "Building the future of asynchronous team collaboration. Providing tools for standups, chat, and project tracking.",
      "sameAs": [
        "https://twitter.com/spiretrack",
        "https://linkedin.com/company/spiretrack"
      ],
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer support",
        "email": "support@spiretrack.app"
      }
    }
    </script>
    
    <!-- JSON-LD for WebSite with SearchAction -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "SpireTrack",
      "url": "https://spiretrack.app",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://spiretrack.app/search?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
